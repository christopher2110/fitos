<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitOS — Integration Diagnostics</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3d;
      --text: #e2e8f0;
      --muted: #8892a4;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --blue: #60a5fa;
      --green-bg: rgba(34,197,94,.1);
      --amber-bg: rgba(245,158,11,.1);
      --red-bg: rgba(239,68,68,.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo { font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
    .page-title { font-size: 13px; color: var(--muted); }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); cursor: pointer;
      font-size: 13px; font-weight: 500; transition: background .15s, border-color .15s;
      text-decoration: none;
    }
    .btn:hover { background: var(--border); border-color: #3a3d55; }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn-primary:hover { background: #3b82f6; border-color: #3b82f6; }
    main { max-width: 960px; margin: 0 auto; padding: 28px 24px 60px; }
    .meta-bar {
      display: flex; align-items: center; gap: 16px; margin-bottom: 28px;
      font-size: 12px; color: var(--muted);
    }
    .meta-bar span { display: flex; align-items: center; gap: 5px; }
    section { margin-bottom: 36px; }
    h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; color: var(--text); }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    td { padding: 13px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .badge-ok   { background: var(--green-bg); color: var(--green); }
    .badge-warn { background: var(--amber-bg); color: var(--amber); }
    .badge-error { background: var(--red-bg);  color: var(--red); }
    .badge-loading { background: rgba(148,163,184,.1); color: var(--muted); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .latency { font-size: 12px; color: var(--muted); }
    .msg { font-size: 13px; color: var(--text); }
    .details-btn {
      background: none; border: none; color: var(--blue); cursor: pointer;
      font-size: 12px; padding: 2px 6px; border-radius: 4px;
    }
    .details-btn:hover { background: rgba(96,165,250,.1); }
    .action-btns { display: flex; align-items: center; gap: 6px; }
    .test-btn {
      background: none; border: 1px solid var(--border); color: var(--text);
      cursor: pointer; font-size: 12px; padding: 4px 10px; border-radius: 5px;
      transition: background .12s;
    }
    .test-btn:hover { background: var(--border); }
    .test-btn:disabled { opacity: .4; cursor: default; }

    /* Env checklist */
    .env-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 8px;
    }
    .env-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 13px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px;
    }
    .env-item.missing:not(.optional) { border-color: rgba(239,68,68,.3); }
    .env-item.optional-missing { border-color: rgba(245,158,11,.2); }
    .env-icon { font-size: 14px; margin-top: 1px; flex-shrink: 0; }
    .env-key { font-size: 12px; font-family: 'SF Mono', 'Fira Mono', monospace; color: var(--text); font-weight: 500; }
    .env-label { font-size: 11px; color: var(--muted); }
    .env-fix { font-size: 11px; margin-top: 4px; }
    .env-fix a { color: var(--blue); text-decoration: none; }
    .env-fix a:hover { text-decoration: underline; }

    /* Details popover */
    .details-panel {
      margin-top: 6px; padding: 10px 12px;
      background: rgba(0,0,0,.25); border-radius: 6px;
      font-size: 12px; color: var(--muted); display: none;
    }
    .details-panel.open { display: block; }
    .details-panel dt { color: var(--muted); display: inline; }
    .details-panel dd { color: var(--text); display: inline; margin-left: 4px; font-family: monospace; }
    .details-panel dl { display: flex; flex-direction: column; gap: 3px; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid var(--border); border-top-color: var(--blue);
      border-radius: 50%; animation: spin .6s linear infinite;
    }

    /* Last-checked timestamp */
    .ts { font-size: 11px; color: var(--muted); }

    /* JSON link bar */
    .json-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 28px;
    }
    .json-bar span { font-size: 13px; color: var(--muted); }
    .mono { font-family: 'SF Mono','Fira Mono',monospace; font-size: 12px; color: var(--blue); }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="/dashboard" class="logo">FitOS</a>
    <span class="page-title">/ Admin Diagnostics</span>
  </div>
  <button class="btn btn-primary" id="refresh-all">
    <span id="refresh-icon">↻</span> Refresh all
  </button>
</header>

<main>
  <div class="meta-bar">
    <span>Last checked: <b id="last-checked">—</b></span>
    <span id="overall-status"></span>
  </div>

  <div class="json-bar">
    <span>JSON endpoint for scripting:</span>
    <span class="mono" id="json-url"></span>
    <a id="json-link" href="#" class="btn" target="_blank" rel="noopener">Open JSON ↗</a>
  </div>

  <!-- Integration table -->
  <section>
    <h2>Integration Health</h2>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Integration</th>
            <th>Status</th>
            <th>Latency</th>
            <th>Message / Details</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="integrations-tbody">
          <tr><td colspan="5" style="color:var(--muted);padding:20px 14px">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Env vars checklist -->
  <section>
    <h2>Environment Variables</h2>
    <div class="env-grid" id="env-grid">
      <div style="color:var(--muted)">Loading…</div>
    </div>
  </section>
</main>

<script>
  // Derive API URL from current page URL (preserves ?key= param)
  const params = new URLSearchParams(window.location.search);
  const key = params.get('key') || '';
  const apiBase = window.location.pathname.replace(/\/?$/, '') + '/api' + (key ? `?key=${encodeURIComponent(key)}` : '');
  const jsonUrl = window.location.origin + apiBase;

  document.getElementById('json-url').textContent = apiBase;
  document.getElementById('json-link').href = jsonUrl;

  function badge(status) {
    const map = {
      ok:      ['badge-ok',      '●', 'OK'],
      warn:    ['badge-warn',    '●', 'WARN'],
      error:   ['badge-error',   '●', 'ERROR'],
      loading: ['badge-loading', '', 'Checking…'],
    };
    const [cls, dot, label] = map[status] || map.loading;
    return `<span class="badge ${cls}"><span class="dot"></span>${label}</span>`;
  }

  function renderIntegrations(integrations) {
    const tbody = document.getElementById('integrations-tbody');
    if (!integrations || !integrations.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="color:var(--muted)">No data</td></tr>';
      return;
    }
    tbody.innerHTML = integrations.map((row, i) => {
      const lat = row.latency != null ? `<span class="latency">${row.latency} ms</span>` : '<span class="latency">—</span>';
      const detailKeys = row.details ? Object.keys(row.details) : [];
      const detailHtml = detailKeys.length
        ? `<button class="details-btn" onclick="toggleDetails('d${i}')">details ▾</button>
           <div class="details-panel" id="d${i}">
             <dl>${detailKeys.map(k => `<div><dt>${k}:</dt><dd>${row.details[k]}</dd></div>`).join('')}</dl>
           </div>`
        : '';

      return `<tr>
        <td><strong>${row.name}</strong></td>
        <td>${badge(row.status)}</td>
        <td>${lat}</td>
        <td>
          <div class="msg">${escHtml(row.message || '')}</div>
          ${detailHtml}
        </td>
        <td>
          <button class="test-btn" onclick="testOne(${i}, this)">Test now</button>
        </td>
      </tr>`;
    }).join('');
  }

  function renderEnvGrid(envVars) {
    const grid = document.getElementById('env-grid');
    if (!envVars || !envVars.length) { grid.innerHTML = '<div style="color:var(--muted)">No data</div>'; return; }
    grid.innerHTML = envVars.map(v => {
      const icon = v.present ? '✅' : (v.optional ? '⚠️' : '❌');
      const cls = v.present ? '' : (v.optional ? 'optional-missing' : 'missing');
      const fixPart = (!v.present && v.fixUrl)
        ? `<div class="env-fix"><a href="${v.fixUrl}" target="_blank" rel="noopener">→ Set in Render env vars</a>${v.docsUrl ? ` · <a href="${v.docsUrl}" target="_blank" rel="noopener">Docs</a>` : ''}</div>`
        : '';
      return `<div class="env-item ${cls}">
        <span class="env-icon">${icon}</span>
        <div>
          <div class="env-key">${escHtml(v.key)}</div>
          <div class="env-label">${escHtml(v.label)}${v.optional ? ' <em>(optional)</em>' : ''}</div>
          ${fixPart}
        </div>
      </div>`;
    }).join('');
  }

  function updateMeta(data) {
    document.getElementById('last-checked').textContent = data.checkedAt
      ? new Date(data.checkedAt).toLocaleTimeString()
      : '—';
    const integrations = data.integrations || [];
    const errors = integrations.filter(i => i.status === 'error').length;
    const warns  = integrations.filter(i => i.status === 'warn').length;
    const el = document.getElementById('overall-status');
    if (errors > 0) {
      el.innerHTML = `<span style="color:var(--red)">● ${errors} error${errors > 1 ? 's' : ''}</span>`;
    } else if (warns > 0) {
      el.innerHTML = `<span style="color:var(--amber)">● ${warns} warning${warns > 1 ? 's' : ''}</span>`;
    } else {
      el.innerHTML = `<span style="color:var(--green)">● All systems operational</span>`;
    }
  }

  async function loadAll() {
    const btn = document.getElementById('refresh-all');
    btn.disabled = true;
    document.getElementById('refresh-icon').innerHTML = '<span class="spinner"></span>';
    try {
      const res = await fetch(apiBase);
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
        alert('Error: ' + (err.error || res.status));
        return;
      }
      const data = await res.json();
      renderIntegrations(data.integrations);
      renderEnvGrid(data.envVars);
      updateMeta(data);
      // Store for individual re-tests
      window._lastData = data;
    } catch (err) {
      alert('Failed to load diagnostics: ' + err.message);
    } finally {
      btn.disabled = false;
      document.getElementById('refresh-icon').textContent = '↻';
    }
  }

  async function testOne(idx, btn) {
    btn.disabled = true;
    btn.textContent = '…';
    await loadAll();
    btn.disabled = false;
    btn.textContent = 'Test now';
  }

  function toggleDetails(id) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('open');
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  document.getElementById('refresh-all').addEventListener('click', loadAll);

  // Auto-load on page open
  loadAll();
</script>
</body>
</html>
