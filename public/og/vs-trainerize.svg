<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#EDE6D8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="630" fill="#5C6E3F"/>

  <!-- Badge -->
  <rect x="80" y="72" width="200" height="36" rx="18" fill="#5C6E3F"/>
  <text x="180" y="96" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="1">COMPARISON</text>

  <!-- Main headline -->
  <text x="80" y="210" font-family="Georgia, serif" font-size="60" font-weight="700" fill="#2C2A24" letter-spacing="-2">FitOS vs Trainerize</text>
  <text x="80" y="290" font-family="Georgia, serif" font-size="42" font-weight="600" fill="#5C6E3F" font-style="italic">Stop renting. Start owning.</text>

  <!-- Trainerize card -->
  <rect x="80" y="340" width="480" height="180" rx="16" fill="#FFF5F5" stroke="#FFCCCC" stroke-width="1.5"/>
  <text x="110" y="380" font-family="Arial, sans-serif" font-size="16" fill="#CC4444" font-weight="600">Trainerize</text>
  <text x="110" y="430" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#CC4444">$4,740</text>
  <text x="110" y="465" font-family="Arial, sans-serif" font-size="16" fill="#999">over 5 years · you own nothing</text>
  <text x="110" y="500" font-family="Arial, sans-serif" font-size="14" fill="#999">ABC Fitness acquisition</text>

  <!-- FitOS card -->
  <rect x="600" y="340" width="480" height="180" rx="16" fill="#F0F5E8" stroke="#C8D8A0" stroke-width="1.5"/>
  <text x="630" y="380" font-family="Arial, sans-serif" font-size="16" fill="#5C6E3F" font-weight="600">FitOS</text>
  <text x="630" y="430" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#3D4A1A">$497</text>
  <text x="630" y="465" font-family="Arial, sans-serif" font-size="16" fill="#5C6E3F">once · you own the code forever</text>
  <text x="630" y="500" font-family="Arial, sans-serif" font-size="14" fill="#5C6E3F">MIT license · self-hostable</text>

  <!-- VS divider -->
  <text x="570" y="445" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7A7570" text-anchor="middle">vs</text>

  <!-- Domain -->
  <text x="80" y="580" font-family="Arial, sans-serif" font-size="18" fill="#7A7570">fitos-zc11.polsia.app/vs/trainerize</text>
</svg>
