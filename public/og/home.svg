<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#EDE6D8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5C6E3F"/>
      <stop offset="100%" stop-color="#3D4A1A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)"/>

  <!-- Top decorative border -->
  <rect x="8" y="0" width="1192" height="2" fill="#DDD8CA"/>

  <!-- Bottom decorative border -->
  <rect x="8" y="628" width="1192" height="2" fill="#DDD8CA"/>

  <!-- Logo mark — stylized "F" -->
  <rect x="80" y="80" width="48" height="8" rx="4" fill="#5C6E3F"/>
  <rect x="80" y="80" width="8" height="48" rx="4" fill="#5C6E3F"/>
  <rect x="80" y="104" width="36" height="8" rx="4" fill="#5C6E3F"/>

  <!-- Brand name -->
  <text x="148" y="118" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#3D4A1A" letter-spacing="-1">FitOS</text>

  <!-- Main headline -->
  <text x="80" y="260" font-family="Georgia, serif" font-size="68" font-weight="700" fill="#2C2A24" letter-spacing="-2">Coaching software</text>
  <text x="80" y="340" font-family="Georgia, serif" font-size="68" font-weight="700" fill="#5C6E3F" letter-spacing="-2" font-style="italic">you actually own.</text>

  <!-- Subline -->
  <text x="80" y="410" font-family="Arial, sans-serif" font-size="28" fill="#7A7570" letter-spacing="0">$497 once · No subscriptions · Google Sheets as your database</text>

  <!-- CTA pill -->
  <rect x="80" y="460" width="320" height="64" rx="32" fill="#5C6E3F"/>
  <text x="240" y="500" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Start free trial →</text>

  <!-- Right side decorative grid -->
  <rect x="820" y="140" width="300" height="200" rx="16" fill="rgba(92,110,63,0.08)" stroke="#DDD8CA" stroke-width="1.5"/>
  <text x="970" y="185" font-family="Arial, sans-serif" font-size="13" fill="#7A7570" text-anchor="middle">CLIENTS</text>
  <rect x="845" y="200" width="250" height="24" rx="6" fill="rgba(92,110,63,0.15)"/>
  <rect x="845" y="234" width="200" height="24" rx="6" fill="rgba(92,110,63,0.1)"/>
  <rect x="845" y="268" width="220" height="24" rx="6" fill="rgba(92,110,63,0.1)"/>

  <rect x="820" y="360" width="300" height="160" rx="16" fill="rgba(92,110,63,0.08)" stroke="#DDD8CA" stroke-width="1.5"/>
  <text x="970" y="400" font-family="Arial, sans-serif" font-size="13" fill="#7A7570" text-anchor="middle">AI PROGRAM</text>
  <rect x="845" y="415" width="180" height="24" rx="6" fill="rgba(92,110,63,0.15)"/>
  <rect x="845" y="449" width="250" height="24" rx="6" fill="rgba(92,110,63,0.1)"/>

  <!-- Domain -->
  <text x="80" y="580" font-family="Arial, sans-serif" font-size="20" fill="#7A7570">fitos-zc11.polsia.app</text>
</svg>
