<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F4EFE6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FitOS">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>FitOS — Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:       #F4EFE6;
      --cream-light: #FDFAF5;
      --cream-mid:   #EDE6D8;
      --olive:       #5C6B2A;
      --olive-dark:  #3D4A1A;
      --olive-muted: #8A9650;
      --olive-pale:  #E8EDD6;
      --text:        #2C2A24;
      --text-muted:  #7A7570;
      --border:      #DDD8CA;
      --nav-h:       72px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --compose-h:   72px;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ── HEADER ──────────────────────────────────────────────────────────── */
    .header {
      background: var(--cream);
      padding: 52px 20px 14px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .freshness {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ── DEMO BANNER ─────────────────────────────────────────────────────── */
    .demo-banner {
      background: var(--olive-pale);
      border-bottom: 1px solid var(--border);
      padding: 8px 20px;
      font-size: 12px;
      color: var(--olive-dark);
      font-weight: 500;
      display: none;
      gap: 6px;
      align-items: center;
    }
    .demo-banner.visible { display: flex; }

    /* ── OFFLINE BANNER ──────────────────────────────────────────────────── */
    .offline-banner {
      background: #FFF3CD;
      border-bottom: 1px solid #FFE69C;
      padding: 8px 20px;
      font-size: 12px;
      color: #856404;
      font-weight: 500;
      display: none;
      gap: 6px;
      align-items: center;
    }
    .offline-banner.visible { display: flex; }

    /* ── SKELETON ────────────────────────────────────────────────────────── */
    .skeleton-wrap { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
    .skel-msg {
      display: flex;
      gap: 10px;
    }
    .skel-msg.coach { justify-content: flex-start; }
    .skel-msg.client { justify-content: flex-end; }
    .skel-bubble {
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(90deg, var(--cream-mid) 25%, var(--border) 50%, var(--cream-mid) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    .skel-msg.coach .skel-bubble  { width: 64%; }
    .skel-msg.client .skel-bubble { width: 52%; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ── MESSAGE LIST ────────────────────────────────────────────────────── */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      padding-bottom: calc(var(--compose-h) + var(--nav-h) + var(--safe-bottom) + 16px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    /* Date dividers */
    .date-divider {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 4px 0;
    }

    /* Thread label */
    .thread-label {
      text-align: center;
      font-size: 11px;
      color: var(--olive-muted);
      font-weight: 600;
      background: var(--olive-pale);
      border-radius: 10px;
      padding: 2px 10px;
      display: inline-block;
      margin: 4px auto;
      align-self: center;
    }

    /* Message bubble */
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }

    .msg-row.coach { align-self: flex-start; }
    .msg-row.client { align-self: flex-end; align-items: flex-end; }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
    }

    .msg-row.coach .msg-bubble {
      background: var(--cream-light);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .msg-row.client .msg-bubble {
      background: var(--olive);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    /* Pending (queued offline) bubble */
    .msg-row.client.pending .msg-bubble {
      opacity: 0.65;
    }

    .msg-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
    }

    /* ── EMPTY STATE ─────────────────────────────────────────────────────── */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      padding: 40px 32px;
    }
    .empty-state.visible { display: flex; }

    .empty-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--olive-pale);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: var(--olive-muted);
    }

    .empty-title {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }

    .empty-sub {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 280px;
    }

    /* ── COMPOSE BAR ─────────────────────────────────────────────────────── */
    .compose-bar {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--cream-light);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      z-index: 99;
      min-height: var(--compose-h);
    }

    .compose-input {
      flex: 1;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 10px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: var(--text);
      resize: none;
      outline: none;
      min-height: 42px;
      max-height: 120px;
      line-height: 1.4;
      overflow-y: auto;
      -webkit-appearance: none;
    }

    .compose-input:focus { border-color: var(--olive-muted); }
    .compose-input::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--olive);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s ease, opacity 0.15s ease;
    }

    .send-btn:disabled { background: var(--border); cursor: default; }
    .send-btn:not(:disabled):active { background: var(--olive-dark); }

    /* ── BOTTOM NAV ──────────────────────────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--cream-light);
      border-top: 1px solid var(--border);
      display: flex;
      padding: 0 8px;
      padding-bottom: var(--safe-bottom);
      height: calc(var(--nav-h) + var(--safe-bottom));
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 4px;
      cursor: pointer;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      min-height: 44px;
      border-radius: 12px;
      transition: background 0.15s ease;
    }

    .nav-item:active { background: var(--cream-mid); }
    .nav-icon { width: 24px; height: 24px; color: var(--text-muted); transition: color 0.15s ease; }
    .nav-label {
      font-size: 10px; font-weight: 600; color: var(--text-muted);
      letter-spacing: 0.04em; text-transform: uppercase; transition: color 0.15s ease;
    }
    .nav-item.active .nav-icon { color: var(--olive); }
    .nav-item.active .nav-label { color: var(--olive); }
  </style>
</head>
<body>
  <div class="app">

    <div class="header">
      <div class="header-row">
        <div class="header-title">Messages</div>
        <div class="freshness" id="freshness"></div>
      </div>
    </div>

    <div class="demo-banner" id="demoBanner">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Demo mode — connect a Google Sheet to see real messages
    </div>

    <div class="offline-banner" id="offlineBanner">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0119 12.55"/><path d="M5 12.55a10.94 10.94 0 015.17-2.39"/><path d="M10.71 5.05A16 16 0 0122.56 9"/><path d="M1.42 9a15.91 15.91 0 014.7-2.88"/><path d="M8.53 16.11a6 6 0 016.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
      Offline — messages will send when you reconnect
    </div>

    <!-- Skeleton shown while loading -->
    <div class="skeleton-wrap" id="skeleton">
      <div class="skel-msg coach"><div class="skel-bubble"></div></div>
      <div class="skel-msg client"><div class="skel-bubble"></div></div>
      <div class="skel-msg coach"><div class="skel-bubble" style="width:45%"></div></div>
    </div>

    <!-- Empty state for fresh sheets with no messages -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        </svg>
      </div>
      <div class="empty-title">No messages yet</div>
      <div class="empty-sub">
        Your coach will send you a welcome message here. Send one first to kick things off.
      </div>
    </div>

    <!-- Message thread -->
    <div class="scroll-area" id="messageList"></div>

    <!-- Compose bar -->
    <div class="compose-bar">
      <textarea
        class="compose-input"
        id="composeInput"
        placeholder="Message your coach…"
        rows="1"
        maxlength="2000"
      ></textarea>
      <button class="send-btn" id="sendBtn" disabled aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <a class="nav-item" href="/workouts">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 4v6m0 4v6M18 4v6m0 4v6M2 9h4m12 0h4M2 15h4m12 0h4"/>
        </svg>
        <span class="nav-label">Workouts</span>
      </a>
      <a class="nav-item" href="/checkin">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
        </svg>
        <span class="nav-label">Check-in</span>
      </a>
      <a class="nav-item" href="/history">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span class="nav-label">History</span>
      </a>
      <a class="nav-item active" href="/messages">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        </svg>
        <span class="nav-label">Messages</span>
      </a>
    </nav>

  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    // ── State ────────────────────────────────────────────────────────────────
    const OFFLINE_KEY = 'fitos_msg_queue';
    let messages = [];
    let isDemo = false;
    let lastFetchMs = 0;
    let pollTimer = null;

    // ── DOM ──────────────────────────────────────────────────────────────────
    const skeleton    = document.getElementById('skeleton');
    const emptyState  = document.getElementById('emptyState');
    const messageList = document.getElementById('messageList');
    const demoBanner  = document.getElementById('demoBanner');
    const offlineBanner = document.getElementById('offlineBanner');
    const freshness   = document.getElementById('freshness');
    const composeInput = document.getElementById('composeInput');
    const sendBtn      = document.getElementById('sendBtn');

    // ── Offline queue ────────────────────────────────────────────────────────
    function loadQueue() {
      try { return JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]'); }
      catch (_) { return []; }
    }

    function saveQueue(q) {
      try { localStorage.setItem(OFFLINE_KEY, JSON.stringify(q)); }
      catch (_) {}
    }

    function queueMessage(body) {
      const q = loadQueue();
      q.push({ body, queuedAt: Date.now() });
      saveQueue(q);
    }

    // ── Helpers ──────────────────────────────────────────────────────────────
    function relativeTime(tsMs) {
      const ago = Date.now() - tsMs;
      const mins  = Math.round(ago / 60000);
      const hours = Math.round(ago / 3600000);
      const days  = Math.round(ago / 86400000);
      if (mins  < 1)   return 'just now';
      if (mins  < 60)  return mins + 'm ago';
      if (hours < 24)  return hours + 'h ago';
      if (days  < 7)   return days + 'd ago';
      return Math.round(days / 7) + 'w ago';
    }

    function formatTime(tsMs) {
      const d = new Date(tsMs);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatDate(tsMs) {
      const d = new Date(tsMs);
      const today = new Date();
      const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
      if (d.toDateString() === today.toDateString()) return 'Today';
      if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
      return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function render() {
      const queue = loadQueue();

      // Combine sheet messages + pending queued messages
      const allMessages = [...messages];

      // Add queued messages at top (newest first = they appear at bottom since we reverse the list display order)
      for (const q of queue) {
        allMessages.unshift({
          id: 'q-' + q.queuedAt,
          timestamp: new Date(q.queuedAt).toISOString().replace('T', ' ').substring(0, 16),
          tsMs: q.queuedAt,
          sender: 'Client',
          body: q.body,
          read: false,
          thread: '',
          pending: true,
        });
      }

      skeleton.style.display = 'none';

      if (allMessages.length === 0) {
        emptyState.classList.add('visible');
        messageList.style.display = 'none';
        return;
      }

      emptyState.classList.remove('visible');
      messageList.style.display = 'flex';

      // Sort oldest-first for display (chat style: oldest at top)
      const sorted = [...allMessages].sort((a, b) => a.tsMs - b.tsMs);

      let lastDateStr = '';
      let lastThread = '';
      const fragments = [];

      for (const msg of sorted) {
        const dateStr = formatDate(msg.tsMs);
        if (dateStr !== lastDateStr) {
          fragments.push(`<div class="date-divider">${dateStr}</div>`);
          lastDateStr = dateStr;
        }

        if (msg.thread && msg.thread !== lastThread) {
          fragments.push(`<div class="thread-label">${msg.thread}</div>`);
          lastThread = msg.thread;
        }

        const senderClass = msg.sender === 'Client' ? 'client' : 'coach';
        const pendingClass = msg.pending ? ' pending' : '';
        const pendingMeta  = msg.pending ? ' · Sending…' : '';
        const timeStr = msg.tsMs ? formatTime(msg.tsMs) : '';

        fragments.push(`
          <div class="msg-row ${senderClass}${pendingClass}">
            <div class="msg-bubble">${escapeHtml(msg.body)}</div>
            <div class="msg-meta">${timeStr}${pendingMeta}</div>
          </div>
        `);
      }

      messageList.innerHTML = fragments.join('');

      // Scroll to bottom — newest message visible
      messageList.scrollTop = messageList.scrollHeight;
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    }

    // ── Fetch messages ───────────────────────────────────────────────────────
    async function fetchMessages(isInitial) {
      try {
        const res = await fetch('/messages/api/list');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        messages = data.messages || [];
        isDemo = !!data.demo;

        demoBanner.classList.toggle('visible', isDemo);

        lastFetchMs = Date.now();
        updateFreshness();
        render();

        if (isInitial) skeleton.style.display = 'none';
      } catch (_) {
        // Network failed — keep showing whatever we have
        if (isInitial) {
          skeleton.style.display = 'none';
          render();
        }
      }
    }

    function updateFreshness() {
      if (!lastFetchMs) { freshness.textContent = ''; return; }
      const ago = Math.round((Date.now() - lastFetchMs) / 1000);
      freshness.textContent = ago < 5 ? 'Live' : 'Updated ' + ago + 's ago';
    }

    // ── Send message ─────────────────────────────────────────────────────────
    async function trySend(body) {
      if (!navigator.onLine) {
        queueMessage(body);
        render();
        return;
      }

      try {
        const res = await fetch('/messages/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        // Refresh immediately so the sent message comes back from the Sheet
        await fetchMessages(false);
      } catch (_) {
        // Network failed mid-send — queue it
        queueMessage(body);
        render();
      }
    }

    // ── Flush offline queue ──────────────────────────────────────────────────
    async function flushQueue() {
      const q = loadQueue();
      if (q.length === 0) return;

      const remaining = [];
      for (const item of q) {
        try {
          const res = await fetch('/messages/api/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ body: item.body }),
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          // Successfully sent — do not add back to remaining
        } catch (_) {
          remaining.push(item);
        }
      }

      saveQueue(remaining);
      await fetchMessages(false);
    }

    // ── Compose input logic ──────────────────────────────────────────────────
    composeInput.addEventListener('input', () => {
      sendBtn.disabled = composeInput.value.trim().length === 0;
      // Auto-grow
      composeInput.style.height = 'auto';
      composeInput.style.height = Math.min(composeInput.scrollHeight, 120) + 'px';
    });

    composeInput.addEventListener('keydown', (e) => {
      // Shift+Enter = newline, Enter alone = send
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) doSend();
      }
    });

    sendBtn.addEventListener('click', doSend);

    function doSend() {
      const body = composeInput.value.trim();
      if (!body) return;
      composeInput.value = '';
      composeInput.style.height = 'auto';
      sendBtn.disabled = true;
      trySend(body);
    }

    // ── Online/offline handling ──────────────────────────────────────────────
    function updateOnlineStatus() {
      const offline = !navigator.onLine;
      offlineBanner.classList.toggle('visible', offline);
    }

    window.addEventListener('online', () => {
      updateOnlineStatus();
      flushQueue();
    });

    window.addEventListener('offline', updateOnlineStatus);

    // ── Polling ──────────────────────────────────────────────────────────────
    function schedulePoll() {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(async () => {
        await fetchMessages(false);
        updateFreshness();
        schedulePoll();
      }, 30_000);
    }

    // Tick every second to update "Updated Xs ago" freshness label
    setInterval(updateFreshness, 1000);

    // ── Init ─────────────────────────────────────────────────────────────────
    (async function init() {
      updateOnlineStatus();

      // Show skeleton while loading
      skeleton.style.display = 'flex';
      skeleton.style.flexDirection = 'column';

      await fetchMessages(true);
      schedulePoll();

      // Flush any queued messages from a previous offline session
      if (navigator.onLine) flushQueue();
    })();
  </script>
