<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitOS — Agent History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:        #F4EFE6;
      --cream-light:  #FDFAF5;
      --cream-mid:    #EDE6D8;
      --olive:        #5C6B2A;
      --olive-dark:   #3D4A1A;
      --olive-muted:  #8A9650;
      --olive-pale:   #E8EDD6;
      --text:         #2C2A24;
      --text-muted:   #7A7570;
      --border:       #DDD8CA;
      --sidebar-w:    220px;
      --topbar-h:     60px;
      --red:          #C84B4B;
      --red-pale:     #FEF0F0;
      --green:        #3A7040;
      --green-pale:   #EAF2EA;
    }

    html, body { height: 100%; background: var(--cream); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    .layout { display: flex; min-height: 100vh; }

    /* SIDEBAR */
    .sidebar { width: var(--sidebar-w); background: var(--cream-light); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; }
    .sidebar-brand { padding: 22px 20px 20px; border-bottom: 1px solid var(--border); }
    .brand-wordmark { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; color: var(--olive); letter-spacing: -0.02em; }
    .brand-tagline { font-size: 10px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 6px; }
    .sidebar-nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
    .nav-section-label { font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; padding: 10px 10px 4px; }
    .nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; text-decoration: none; font-size: 13.5px; font-weight: 500; color: var(--text-muted); transition: background 0.12s; }
    .nav-link:hover { background: var(--cream-mid); color: var(--text); }
    .nav-link.active { background: var(--olive-pale); color: var(--olive-dark); font-weight: 600; }
    .nav-icon { width: 17px; height: 17px; flex-shrink: 0; opacity: 0.7; }
    .nav-link.active .nav-icon { opacity: 1; }
    .sidebar-footer { padding: 14px; border-top: 1px solid var(--border); }
    .coach-chip { display: flex; align-items: center; gap: 9px; }
    .coach-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--olive); color: var(--cream-light); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Fraunces', serif; }
    .coach-name-small { font-size: 13px; font-weight: 600; color: var(--text); }
    .coach-role { font-size: 11px; color: var(--text-muted); }

    /* MAIN */
    .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { height: var(--topbar-h); background: var(--cream-light); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; position: sticky; top: 0; z-index: 40; }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-back { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); text-decoration: none; font-weight: 500; padding: 6px 10px; border-radius: 8px; transition: background 0.1s; }
    .topbar-back:hover { background: var(--cream-mid); color: var(--text); }
    .topbar-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; color: var(--text); }
    .page-content { padding: 28px; flex: 1; }

    /* TABLE */
    .table-card { background: var(--cream-light); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .table-hd { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .table-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; color: var(--text); }
    .table-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 10px 20px; text-align: left; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 14px 20px; font-size: 13px; color: var(--text); border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--cream); }

    .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 8px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .status-completed { background: var(--green-pale); color: var(--green); }
    .status-failed    { background: var(--red-pale); color: var(--red); }
    .status-running   { background: var(--cream-mid); color: var(--text-muted); }

    .trigger-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 7px; background: var(--cream-mid); color: var(--text-muted); text-transform: uppercase; }

    .output-cell { max-width: 380px; }
    .output-text { font-size: 12px; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .output-error { font-size: 12px; color: var(--red); }

    .tokens-cell { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .cost-cell   { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

    .expand-btn { font-size: 11px; font-weight: 600; color: var(--olive); cursor: pointer; margin-top: 4px; display: inline-block; }

    /* DETAIL DRAWER */
    .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; justify-content: flex-end; }
    .drawer-backdrop.hidden { display: none; }
    .drawer { width: 480px; max-width: 100%; height: 100%; background: var(--cream-light); overflow-y: auto; padding: 28px; }
    .drawer-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .drawer-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
    .drawer-section { margin-bottom: 20px; }
    .drawer-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 6px; }
    .drawer-body { font-size: 13px; color: var(--text); line-height: 1.6; background: var(--cream); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
    .drawer-close { float: right; cursor: pointer; font-size: 18px; color: var(--text-muted); margin-left: 10px; }

    .tools-list { display: flex; flex-direction: column; gap: 6px; }
    .tool-item { font-size: 12px; background: var(--cream); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text-muted); font-family: monospace; }

    .empty-runs { text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: 13px; }

    @media (max-width: 760px) { :root { --sidebar-w: 0px; } .sidebar { display: none; } .drawer { width: 100%; } }
  </style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-wordmark">FitOS</div>
      <div class="brand-tagline">Coaching Platform</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Workspace</div>
      <a class="nav-link" href="/dashboard"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a class="nav-link" href="/dashboard/messages"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>Messages</a>
      <a class="nav-link" href="/dashboard/clients"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Clients</a>
      <a class="nav-link" href="/dashboard/exercises"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2z"/><path d="M8 10h8M8 14h5"/></svg>Exercise Library</a>
      <a class="nav-link active" href="/dashboard/agents"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 10-16 0"/></svg>My Agents</a>
      <div class="nav-section-label" style="margin-top:6px">AI Tools</div>
      <a class="nav-link" href="/dashboard/agents/builder"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>Program Builder<span style="font-size:9px;font-weight:700;background:var(--olive);color:#fff;padding:2px 6px;border-radius:10px;margin-left:auto">AI</span></a>
      <a class="nav-link" href="/settings/agents"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2"/></svg>Claude Skills</a>
    </nav>
    <div class="sidebar-footer">
      <div class="coach-chip">
        <div class="coach-avatar" id="coach-avatar">C</div>
        <div>
          <div class="coach-name-small" id="coach-name">Coach</div>
          <div class="coach-role">FitOS</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <a class="topbar-back" href="/dashboard/agents">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          My Agents
        </a>
        <div class="topbar-title" id="page-title">Agent History</div>
      </div>
    </header>

    <div class="page-content">
      <div class="table-card">
        <div class="table-hd">
          <div>
            <div class="table-title" id="agent-name-display">—</div>
            <div class="table-sub">Audit log of all runs for this agent</div>
          </div>
        </div>
        <div id="runs-container">
          <div style="text-align:center;padding:40px;color:var(--text-muted);font-size:13px">Loading…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Detail drawer -->
<div class="drawer-backdrop hidden" id="drawer">
  <div class="drawer">
    <span class="drawer-close" onclick="closeDrawer()">✕</span>
    <div class="drawer-title" id="drawer-title">Run detail</div>
    <div class="drawer-meta" id="drawer-meta"></div>

    <div class="drawer-section" id="drawer-output-section">
      <div class="drawer-label">Output</div>
      <div class="drawer-body" id="drawer-output"></div>
    </div>

    <div class="drawer-section" id="drawer-tools-section" style="display:none">
      <div class="drawer-label">Tools called</div>
      <div class="tools-list" id="drawer-tools"></div>
    </div>

    <div class="drawer-section" id="drawer-error-section" style="display:none">
      <div class="drawer-label">Error</div>
      <div class="drawer-body" id="drawer-error" style="color:var(--red)"></div>
    </div>
  </div>
</div>

<script>
  const live    = window.__COACH_LIVE__ || {};
  const agentId = live.agentId;
  const agentName = live.agentName || 'Agent';

  if (live.coachName) {
    document.getElementById('coach-name').textContent = live.coachName;
    document.getElementById('coach-avatar').textContent = live.coachName[0].toUpperCase();
  }

  document.getElementById('page-title').textContent = `${agentName} — History`;
  document.getElementById('agent-name-display').textContent = agentName;

  async function loadRuns() {
    const resp = await fetch(`/api/custom-agents/agents/${agentId}/runs?limit=100`);
    const data = await resp.json();
    const container = document.getElementById('runs-container');

    if (!data.ok || !data.runs || data.runs.length === 0) {
      container.innerHTML = '<div class="empty-runs">No runs yet — run this agent from the Agents page.</div>';
      return;
    }

    let html = `<table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Status</th>
          <th>Trigger</th>
          <th>Output</th>
          <th>Tokens</th>
          <th>Est. Cost</th>
        </tr>
      </thead>
      <tbody>`;

    for (const run of data.runs) {
      const date    = new Date(run.started_at).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
      const status  = run.status;
      const usage   = run.usage_json || {};
      const tokens  = usage.total_tokens ? usage.total_tokens.toLocaleString() : '—';
      const cost    = usage.total_tokens ? estimateCost(usage) : '—';
      const outSnip = (run.output_text || '').slice(0, 100);

      html += `<tr>
        <td style="white-space:nowrap;font-size:12px">${esc(date)}</td>
        <td><span class="status-badge status-${esc(status)}">${statusLabel(status)}</span></td>
        <td><span class="trigger-badge">${esc(run.trigger || 'manual')}</span></td>
        <td class="output-cell">
          ${status === 'failed'
            ? `<div class="output-error">${esc((run.error_message || '').slice(0, 120))}</div>`
            : `<div class="output-text">${esc(outSnip)}${run.output_text && run.output_text.length > 100 ? '…' : ''}</div>
               <span class="expand-btn" onclick='openDrawer(${JSON.stringify(run)})'>View full ↗</span>`
          }
        </td>
        <td class="tokens-cell">${tokens}</td>
        <td class="cost-cell">${cost}</td>
      </tr>`;
    }

    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function statusLabel(s) {
    if (s === 'completed') return '✓ Done';
    if (s === 'failed')    return '✗ Failed';
    return '⋯ Running';
  }

  function estimateCost(usage) {
    const input  = (usage.prompt_tokens    || 0) / 1_000_000 * 2.50;
    const output = (usage.completion_tokens || 0) / 1_000_000 * 10.00;
    return `$${(input + output).toFixed(4)}`;
  }

  function openDrawer(run) {
    document.getElementById('drawer-title').textContent = `Run on ${new Date(run.started_at).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })}`;
    const usage = run.usage_json || {};
    const parts = [];
    if (usage.prompt_tokens)     parts.push(`${usage.prompt_tokens.toLocaleString()} input tokens`);
    if (usage.completion_tokens) parts.push(`${usage.completion_tokens.toLocaleString()} output tokens`);
    document.getElementById('drawer-meta').textContent = parts.join(' · ') || 'No usage data';

    if (run.output_text) {
      document.getElementById('drawer-output').textContent = run.output_text;
      document.getElementById('drawer-output-section').style.display = 'block';
    } else {
      document.getElementById('drawer-output-section').style.display = 'none';
    }

    const tools = run.tools_called || [];
    if (tools.length > 0) {
      document.getElementById('drawer-tools-section').style.display = 'block';
      document.getElementById('drawer-tools').innerHTML = tools.map(t =>
        `<div class="tool-item">${esc(t.function || JSON.stringify(t))}</div>`
      ).join('');
    } else {
      document.getElementById('drawer-tools-section').style.display = 'none';
    }

    if (run.error_message) {
      document.getElementById('drawer-error-section').style.display = 'block';
      document.getElementById('drawer-error').textContent = run.error_message;
    } else {
      document.getElementById('drawer-error-section').style.display = 'none';
    }

    document.getElementById('drawer').classList.remove('hidden');
  }

  function closeDrawer() {
    document.getElementById('drawer').classList.add('hidden');
  }

  // Close drawer on backdrop click
  document.getElementById('drawer').addEventListener('click', (e) => {
    if (e.target === document.getElementById('drawer')) closeDrawer();
  });

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadRuns();
</script>
</body>
</html>
